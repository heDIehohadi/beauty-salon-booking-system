name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: salon_user
          POSTGRES_PASSWORD: salon_password
          POSTGRES_DB: salon_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U salon_user -d salon_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend/beautysalon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r ../requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Django system check
        run: python manage.py check

      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      - name: Tests (SQLite)
        run: python manage.py test

      - name: Tests (PostgreSQL)
        run: python manage.py test
        env:
          DJANGO_DB_NAME: salon_db
          DJANGO_DB_USER: salon_user
          DJANGO_DB_PASSWORD: salon_password
          DJANGO_DB_HOST: localhost
          DJANGO_DB_PORT: "5432"
